name: Run Expense Pipeline

on:
  push:
    paths:
      - 'statements/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Required Libraries
      run: |
        python -m pip install --upgrade pip
        pip install pandas google-genai gspread oauth2client pypdf

    - name: Write Google Credentials to File
      env:
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      run: |
        mkdir -p credentials
        echo "$GOOGLE_CREDS_JSON" > credentials/service_account.json

    - name: Execute Expense Tracker Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PDF_PASSWORDS: ${{ secrets.PDF_PASSWORDS }}
        GOOGLE_SERVICE_ACCOUNT_JSON: credentials/service_account.json
      run: python expense_tracker.py --drive-sync
