repos:
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest quality gate
        entry: .\.venv\Scripts\python.exe -m pytest tests/ -v
        language: system
        pass_filenames: false
        always_run: true
      - id: black-check
        name: black formatting check
        entry: .\.venv\Scripts\black.exe --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright-check
        name: pyright static type check
        entry: .\.venv\Scripts\pyright.exe
        language: system
        pass_filenames: false
        always_run: true
